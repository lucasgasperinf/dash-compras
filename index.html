<!DOCTYPE html>
<html lang="pt-BR">
<head>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#faf7f8;min-height:100vh;color:#3F1D15;}
input,select,textarea{font-family:inherit;font-size:13px;padding:7px 10px;border:1px solid #d9bcc6;border-radius:8px;background:#fff;color:#3F1D15;width:100%;outline:none;}
input:focus,select:focus,textarea:focus{border-color:#651D32;box-shadow:0 0 0 2px rgba(101,29,50,.12);}
button{font-family:inherit;cursor:pointer;}
button:disabled{opacity:.5;cursor:not-allowed;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-thumb{background:#d9bcc6;border-radius:3px;}
th{text-align:left;}
.card{background:#fff;border-radius:12px;border:1px solid #e2d8df;padding:16px;}
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
.badge-red{background:#FDECEA;color:#C0392B;}
.badge-yellow{background:#FEF9E7;color:#D68910;}
.badge-green{background:#EAFAF1;color:#1E8449;}
.badge-blue{background:#EBF5FB;color:#2E86C1;}
.badge-purple{background:#F4ECF7;color:#7D3C98;}
.badge-gray{background:#F2F3F4;color:#5D6D7E;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;border:none;font-size:13px;font-weight:500;transition:all .15s;white-space:nowrap;}
.btn-primary{background:#651D32;color:#fff;}
.btn-primary:hover:not(:disabled){background:#1D5A1D;}
.btn-outline{background:#fff;color:#651D32;border:1px solid #d9bcc6;}
.btn-outline:hover:not(:disabled){background:#faf7f8;}
.btn-danger{background:#FDECEA;color:#C0392B;border:1px solid #F5B7B1;}
.btn-danger:hover:not(:disabled){background:#F5B7B1;}
.btn-sm{padding:4px 10px;font-size:12px;}
.btn-xs{padding:3px 8px;font-size:11px;}
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{padding:9px 12px;border-bottom:2px solid #e2d8df;color:#7a6575;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;}
.tbl td{padding:8px 12px;border-bottom:1px solid #fbf1f4;vertical-align:middle;}
.tbl tr:hover td{background:#fbf1f4;}
.tbl tr.row-red td{background:#FEF0EF !important;}
.tbl tr.row-orange td{background:#FEF5EC !important;}
.tbl tr.row-yellow td{background:#FFFBF0 !important;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal{background:#fff;border-radius:16px;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;padding:24px;}
.modal-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.form-row{margin-bottom:14px;}
.form-row label{display:block;font-size:12px;font-weight:600;color:#7a6575;margin-bottom:5px;}
.kpi-card{background:#fff;border-radius:12px;border:1px solid #e2d8df;padding:18px 20px;}
.kpi-val{font-size:26px;font-weight:700;color:#3F1D15;line-height:1.1;}
.kpi-lbl{font-size:12px;color:#7a6575;margin-top:4px;}
.kpi-sub{font-size:11px;color:#9a8791;margin-top:6px;}
.tab{padding:9px 16px;border:none;background:none;cursor:pointer;font-size:13px;font-weight:500;color:#7a6575;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;}
.tab.active{color:#651D32;border-bottom-color:#651D32;}
.tab:hover:not(.active){color:#651D32;background:rgba(101,29,50,.04);}
.sync-dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0;}
.sync-idle{background:#d9bcc6;}
.sync-saving{background:#F0B429;animation:blink 1s infinite;}
.sync-saved{background:#2ECC71;}
.sync-error{background:#C0392B;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}
.empty{text-align:center;padding:56px 24px;color:#9a8791;}
.empty-icon{font-size:44px;margin-bottom:12px;}
.drag-zone{border:2px dashed #d9bcc6;border-radius:12px;padding:36px;text-align:center;cursor:pointer;transition:all .15s;}
.drag-zone:hover,.drag-zone.over{background:#F0F8F0;border-color:#651D32;}
.pill{display:inline-flex;align-items:center;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:500;border:1.5px solid transparent;cursor:pointer;transition:all .15s;}
/* OC status timeline */
.oc-timeline{display:flex;align-items:center;gap:0;margin:12px 0;}
.oc-step{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;}
.oc-step-dot{width:10px;height:10px;border-radius:50%;border:2px solid #e2d8df;background:#fff;position:relative;z-index:1;}
.oc-step-dot.done{background:#651D32;border-color:#651D32;}
.oc-step-dot.current{background:#fff;border-color:#651D32;box-shadow:0 0 0 3px rgba(101,29,50,.2);}
.oc-step-lbl{font-size:10px;color:#9a8791;text-align:center;white-space:nowrap;}
.oc-step-lbl.done{color:#651D32;font-weight:600;}
.oc-step-lbl.current{color:#651D32;font-weight:700;}
.oc-step-date{font-size:9px;color:#d9bcc6;text-align:center;}
.oc-line{flex:1;height:2px;background:#e2d8df;margin-top:-6px;}
.oc-line.done{background:#651D32;}
/* Toast */
.toast{position:fixed;bottom:24px;right:24px;z-index:500;background:#3F1D15;color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:0 4px 20px rgba(0,0,0,.3);display:flex;align-items:center;gap:10px;max-width:380px;animation:slideIn .2s ease;}
@keyframes slideIn{from{transform:translateY(16px);opacity:0;}to{transform:translateY(0);opacity:1;}}
</style>
</head>
<body>

<script>
'use strict';
var R=React,h=R.createElement;
var useState=R.useState,useEffect=R.useEffect,useMemo=R.useMemo,useRef=R.useRef,useCallback=R.useCallback;

// ── CONFIG ──────────────────────────────────────────────────────────────
// Projeto de IDENTIDADE central do Portal Amora (login Microsoft + RLS)
var SUPA_URL='https://taqbvuysdkmunvhteyws.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRhcWJ2dXlzZGttdW52aHRleXdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NzgyNzcsImV4cCI6MjEwNDU1NDI3N30.aRgUg3WYwUuZ548MZdsmzLa93TXDLjVgbnCYh_sBpq8';
var APP_KEY='compras';        // chave deste app no portal (app_data / app_permissions)
var DATA_SCOPE='shared';      // Compras usa dados compartilhados
var PORTAL_URL='https://amoraportal.netlify.app';
// Cliente Supabase (auth + sessão). O acesso a dados continua via REST no store.
var sbc=window.supabase.createClient(SUPA_URL,SUPA_KEY);

// ── UTILS ────────────────────────────────────────────────────────────────
function uid(){return 'c'+Date.now().toString(36)+(Math.random()*0xFFFFF|0).toString(36);}
function fmt$(v){return(Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function fmt1(v){return(Number(v)||0).toFixed(1);}
function fmt0(v){return Math.round(Number(v)||0);}
function fmtPct(v){return(Number(v)||0).toFixed(1)+'%';}
function fmtDate(s){if(!s)return'—';try{return new Date(s+'T12:00:00').toLocaleDateString('pt-BR');}catch(e){return s;}}
function norm(s){return(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();}
function padNum(n,len){return String(n).padStart(len,'0');}

function parseNum(v){
  if(typeof v==='number')return v;
  if(!v&&v!==0)return 0;
  var s=String(v).replace(/[R$\s%]/g,'').trim();
  if(!s||s==='-')return 0;
  // Formato brasileiro tem vírgula como decimal ("1.234,56" ou "1,58")
  if(s.includes(',')){
    return parseFloat(s.replace(/\./g,'').replace(',','.'))||0;
  }
  // String vinda do XLSX.js (float com ponto como decimal: "33.766666", "104.3")
  return parseFloat(s)||0;
}
function statusFromDias(d){
  if(!d||d<=0)return'SEM ESTOQUE';
  if(d<15)return'CRÍTICO';
  if(d<30)return'REPOR';
  return'OK';
}
function badgeClass(s){
  var m={'SEM ESTOQUE':'badge-red','CRÍTICO':'badge-red','REPOR':'badge-yellow','OK':'badge-green'};
  return'badge '+(m[s]||'badge-gray');
}
function rowCls(dias){var d=dias||0;if(d<=0)return'row-red';if(d<30)return'row-yellow';return'';}
function rowClsStock(est,cob){if((est||0)<=0)return'row-red';var d=cob||0;if(d>0&&d<15)return'row-orange';if(d<30)return'row-yellow';return'';}

// Status → estilo OC
var OC_SC={
  'Rascunho':        {bg:'#F2F3F4',tx:'#5D6D7E',idx:0},
  'OC Enviada':      {bg:'#FEF9E7',tx:'#D68910',idx:1},
  'NF Faturada':     {bg:'#FEF3E2',tx:'#E67E22',idx:2},
  'CTe Emitido':     {bg:'#EBF5FB',tx:'#2E86C1',idx:3},
  'Agd. Entrega':    {bg:'#F4ECF7',tx:'#7D3C98',idx:4},
  'Recebido':        {bg:'#EAFAF1',tx:'#1E8449',idx:5},
  'Divergência':     {bg:'#FFF9E6',tx:'#856404',idx:6},
  'Cancelado':       {bg:'#FDECEA',tx:'#C0392B',idx:-1}
};
var OC_FLOW=['Rascunho','OC Enviada','NF Faturada','CTe Emitido','Agd. Entrega','Recebido'];

// ── STORE (KV — padrão Amora) ────────────────────────────────────────────
var _token=null,_curEmail=null,_curUserId=null,_cache={};
var _loaded=false,_pending=0,_syncState='idle',_syncMsg='';
var _syncListeners=[];

function _setSync(s,msg){_syncState=s;_syncMsg=msg||'';_syncListeners.forEach(function(fn){try{fn(s,msg);}catch(e){}});}
function _lk(k){return'compras_v1_'+k;}
function _wl(k,v){try{localStorage.setItem(_lk(k),JSON.stringify({v:v,t:Date.now()}));}catch(e){}}
function _rl(k){try{var r=localStorage.getItem(_lk(k));if(!r)return null;var o=JSON.parse(r);return(o&&o.v!==undefined)?o:null;}catch(e){return null;}}
function _hdrs(){var h={'Content-Type':'application/json','apikey':SUPA_KEY};if(_token)h['Authorization']='Bearer '+_token;return h;}
function _doPost(k,v,retry){
  return fetch(SUPA_URL+'/rest/v1/app_data',{method:'POST',
    headers:Object.assign({},_hdrs(),{'Prefer':'resolution=merge-duplicates'}),
    body:JSON.stringify({app_key:APP_KEY,scope:DATA_SCOPE,key:k,value:v})
  }).then(function(r){
    if(!r.ok&&retry>0&&r.status>=500)return new Promise(function(res){setTimeout(function(){res(_doPost(k,v,retry-1));},1500);});
    if(!r.ok)throw new Error('HTTP '+r.status);return r;
  });
}
var store={
  get:function(k){return _cache[k]!==undefined?_cache[k]:null;},
  set:function(k,v){
    _cache[k]=v;_wl(k,v);
    if(!_token)return;
    _pending++;_setSync('saving');
    _doPost(k,v,2)
      .then(function(){_pending--;if(_pending===0){_setSync('saved');setTimeout(function(){if(_pending===0)_setSync('idle');},2000);}})
      .catch(function(e){_pending--;console.warn('[store]',k,e.message);_setSync('error','Salvo localmente');});
  },
  onSync:function(fn){_syncListeners.push(fn);return function(){_syncListeners=_syncListeners.filter(function(f){return f!==fn;});};},
  syncState:function(){return{state:_syncState,msg:_syncMsg};},
  // Login via Microsoft (SSO central). Redireciona e volta para esta mesma URL.
  loginMicrosoft:function(){
    return sbc.auth.signInWithOAuth({provider:'azure',
      options:{scopes:'email openid profile',redirectTo:window.location.origin+window.location.pathname}});
  },
  // Recupera a sessão atual (após o redirect do OAuth ou em recarregamento).
  initSession:async function(){
    var res=await sbc.auth.getSession();
    var s=res&&res.data?res.data.session:null;
    if(!s){_token=null;_curEmail=null;_curUserId=null;return null;}
    _token=s.access_token;_curEmail=(s.user&&s.user.email)||null;_curUserId=(s.user&&s.user.id)||null;
    return {token:_token,email:_curEmail,user:s.user};
  },
  // Verifica se o usuário tem acesso a ESTE app (papel em app_permissions ou admin do portal).
  checkAccess:async function(){
    if(!_token)return {ok:false,reason:'no-session'};
    try{
      var pr=await fetch(SUPA_URL+'/rest/v1/profiles?select=is_admin,is_active&limit=1',{headers:_hdrs()});
      var profs=await pr.json();var prof=Array.isArray(profs)&&profs[0]?profs[0]:{};
      if(prof.is_active===false)return {ok:false,reason:'inactive'};
      if(prof.is_admin===true)return {ok:true,role:'admin',isAdmin:true};
      var rr=await fetch(SUPA_URL+'/rest/v1/app_permissions?select=role&app_key=eq.'+APP_KEY+'&limit=1',{headers:_hdrs()});
      var perms=await rr.json();
      if(Array.isArray(perms)&&perms[0])return {ok:true,role:perms[0].role,isAdmin:false};
      return {ok:false,reason:'no-permission'};
    }catch(e){return {ok:false,reason:'error',msg:e.message};}
  },
  // Registro de auditoria central (best-effort).
  audit:function(action,meta){
    if(!_token)return;
    try{fetch(SUPA_URL+'/rest/v1/audit_log',{method:'POST',headers:_hdrs(),
      body:JSON.stringify({user_id:_curUserId,user_email:_curEmail,app_key:APP_KEY,action:action,metadata:meta||null,user_agent:navigator.userAgent})});}catch(e){}
  },
  loadAll:async function(){
    _loaded=false;
    if(!_token){
      ['fornecedores','sugestoes','pedidos','oc_seq','validades'].forEach(function(k){var l=_rl(k);if(l&&l.v!==undefined)_cache[k]=l.v;});
      _loaded=true;return;
    }
    try{
      var r=await fetch(SUPA_URL+'/rest/v1/app_data?select=key,value&app_key=eq.'+APP_KEY+'&scope=eq.'+DATA_SCOPE,{headers:_hdrs()});
      if(!r.ok)throw new Error('HTTP '+r.status);
      var rows=await r.json();
      if(Array.isArray(rows))rows.forEach(function(row){_cache[row.key]=row.value;});
      _loaded=true;
    }catch(e){
      console.warn('[loadAll]',e.message);
      _setSync('error','Sem conexão — dados locais');
      ['fornecedores','sugestoes','pedidos','oc_seq','validades'].forEach(function(k){var l=_rl(k);if(l&&l.v!==undefined&&!_cache[k])_cache[k]=l.v;});
      _loaded=true;
    }
  },
  signOut:function(){try{sbc.auth.signOut();}catch(e){}_token=null;_curEmail=null;_curUserId=null;_cache={};_loaded=false;_setSync('idle','');}
};

// ── PRÓXIMO NÚMERO DE OC ──────────────────────────────────────────────────
function nextOCNum(){
  var year=new Date().getFullYear();
  var seq=store.get('oc_seq')||{};
  var n=(seq[year]||0)+1;
  seq[year]=n;
  store.set('oc_seq',seq);
  return'OC-'+year+'-'+padNum(n,3);
}

// ── EXCEL PARSER ─────────────────────────────────────────────────────────
var _COL={
  cod:      ['cód.','cod.','código','codigo','cod','sku','código produto'],
  produto:  ['produto','descrição','descricao','description','item','desc.','nome','name','nome produto','descr.'],
  un:       ['un.','un','unidade','unit','und'],
  estoque:  ['estoque atual','estoque','qty estoque','qtd estoque','saldo','quant. atual','quantidade','qtd atual','saldo atual','estq','quant estoque','qt.estoque','qt estoque'],
  media:    ['média diária','media diaria','média/dia','med. diária','consumo médio','consumo diario','media/dia','venda média','média venda','med.diária','media vendas','vda media','vda. media'],
  dias:     ['dias de estoque','dias cobertura','cobertura (dias)','dias','cobertura','dias estoque','cob. dias','cob.','dias cob'],
  necess:   ['necessidade 45 dias','necessidade 40 dias','necessidade','projeção 45','projecao','necessid.','nec. 45d','nec.'],
  sugestao: ['sugestão pedido','sugestão de compra','sugestão','pedido sugerido','qtd sugerida','sugestao pedido','sugestao','qtd. sugerida','sugest.','sug.compra'],
  custo:    ['custo unit. (r$)','custo unit.','custo unitário','custo unitario','custo unit','preço custo','custo','cst. unit','cst.unit','custo médio','cst medio','vlr custo'],
  valor:    ['valor pedido (r$)','valor pedido','total pedido','valor total','total','vlr pedido','vl. pedido'],
  pvenda:   ['preço venda (r$)','preço de venda','preço venda','pvenda','preco venda','p. venda','vl. venda','valor venda'],
  fornecedor:['fornecedor','supplier','forn.','fabricante','forn','marca','representante'],
  status:   ['status','situação','situacao','sit.']
};
function _findCol(headers,field){
  var cands=_COL[field]||[field];
  var nc=cands.map(function(c){return norm(c);});
  // Passe 1: correspondência exata (evita "Custo total" capturar campo "custo")
  for(var i=0;i<headers.length;i++){
    var hn=norm(String(headers[i]));
    for(var j=0;j<nc.length;j++){if(hn===nc[j])return headers[i];}
  }
  // Passe 2: correspondência parcial (includes)
  for(var i=0;i<headers.length;i++){
    var hn=norm(String(headers[i]));
    for(var j=0;j<nc.length;j++){if(hn.includes(nc[j]))return headers[i];}
  }
  return null;
}
// Extrai nome do fornecedor do nome da sheet
function _fornFromSheet(sheetName){
  // Padrão: "... — Fornecedor XYZ" ou "... - XYZ" ou "Por Fornecedor XYZ"
  var patterns=[
    /fornecedor\s+(.+)/i,
    /[—–\-]\s*fornecedor\s+(.+)/i,
    /[—–]\s*(.+)/,
    /sugest[aã]o\s+(.+)/i
  ];
  for(var i=0;i<patterns.length;i++){
    var m=sheetName.match(patterns[i]);
    if(m){
      var forn=m[1].trim();
      // Descartar nomes genéricos
      if(!norm(forn).includes('compras')&&!norm(forn).includes('sugest')&&!norm(forn).includes('estoque'))return forn;
    }
  }
  return'';
}

function parseExcel(file){
  return new Promise(function(resolve,reject){
    var reader=new FileReader();
    reader.onload=function(e){
      try{
        var data=new Uint8Array(e.target.result);
        var wb=XLSX.read(data,{type:'array',raw:false});
        var all=[];
        wb.SheetNames.forEach(function(sheetName){
          var sn=norm(sheetName);
          if(sn.includes('resumo')||sn.includes('painel')||sn.includes('inativos')||sn==='importação')return;
          var forn=_fornFromSheet(sheetName);
          var ws=wb.Sheets[sheetName];
          for(var range=0;range<=4;range++){
            var rows=[];
            try{rows=XLSX.utils.sheet_to_json(ws,{raw:false,defval:'',range:range});}catch(err){continue;}
            if(!rows.length)continue;
            var keys=Object.keys(rows[0]);
            var codC=_findCol(keys,'cod');
            var prodC=_findCol(keys,'produto');
            if(!codC||!prodC)continue;
            var fornC=_findCol(keys,'fornecedor');
            rows.forEach(function(row){
              var cod=String(row[codC]||'').trim();
              var produto=String(row[prodC]||'').trim();
              if(!cod||!produto)return;
              if(norm(cod).startsWith('cód')||norm(cod).startsWith('cod')||norm(cod)==='total'||norm(cod)==='')return;
              if(norm(produto).startsWith('total')||norm(produto).startsWith('obs')||norm(produto).startsWith('legenda'))return;
              var estoque=parseNum(row[_findCol(keys,'estoque')]||0);
              var media=parseNum(row[_findCol(keys,'media')]||0);
              var dias=parseNum(row[_findCol(keys,'dias')]||0);
              var sugestao=parseNum(row[_findCol(keys,'sugestao')]||0);
              var custo=parseNum(row[_findCol(keys,'custo')]||0);
              var valor=parseNum(row[_findCol(keys,'valor')]||0);
              var pvenda=parseNum(row[_findCol(keys,'pvenda')]||0);
              var un=String(row[_findCol(keys,'un')]||'UN').trim()||'UN';
              var necess=parseNum(row[_findCol(keys,'necess')]||0);
              var fornRow=fornC?String(row[fornC]||'').trim():'';
              var statusRaw=String(row[_findCol(keys,'status')]||'').trim().toUpperCase();
              // Recalcular campos ausentes
              if(sugestao>0&&custo>0){valor=valor||sugestao*custo;}else{valor=0;}
              if(!dias&&media>0&&estoque>=0)dias=estoque/media;
              var markup=pvenda>0&&custo>0?Math.round((pvenda-custo)/custo*1000)/10:0;
              var st=statusRaw==='SEM ESTOQUE'?'SEM ESTOQUE':statusRaw==='REPOR'?'REPOR':statusRaw==='OK'?'OK':statusFromDias(Math.round(dias));
              all.push({
                id:uid(),cod:cod,produto:produto,un:un,
                fornecedor_nome:fornRow||forn,
                estoque:estoque,media_diaria:media,
                dias_cobertura:Math.round((dias||0)*10)/10,
                necessidade_45d:necess,sugestao_pedido:sugestao,
                custo_unit:custo,valor_pedido:valor,preco_venda:pvenda,markup:markup,
                status:st,data_ref:new Date().toISOString().slice(0,10)
              });
            });
            break;
          }
        });
        resolve(all);
      }catch(err){reject(err);}
    };
    reader.onerror=function(){reject(new Error('Falha ao ler arquivo'));};
    reader.readAsArrayBuffer(file);
  });
}

// ── CRIAR OCs A PARTIR DE SUGESTÕES ──────────────────────────────────────
function criarOCsFromSugestoes(selItens,pedidos){
  var byF={};
  selItens.forEach(function(s){
    var fn=s.fornecedor_nome||'Sem Fornecedor';
    if(!byF[fn])byF[fn]=[];byF[fn].push(s);
  });
  var novas=[];
  Object.keys(byF).forEach(function(fn){
    var itens=byF[fn];
    var valor_total=itens.reduce(function(acc,s){return acc+(s.valor_pedido||0);},0);
    novas.push({
      id:nextOCNum(),
      fornecedor_nome:fn,
      itens:itens.map(function(s){return{id:s.id,cod:s.cod,produto:s.produto,un:s.un,qtd:s.sugestao_pedido,custo_unit:s.custo_unit,valor:s.valor_pedido||0,obs:''};
      }),
      valor_total:valor_total,
      status:'Rascunho',
      data_emissao:new Date().toISOString().slice(0,10),
      previsao_entrega:'',
      data_envio:null,data_recebimento:null,
      historico:[{status:'Rascunho',data:new Date().toISOString(),user:_curEmail||''}],
      obs:''
    });
  });
  var arr=pedidos.concat(novas);
  store.set('pedidos',arr);
  return{arr:arr,novas:novas};
}

// ── MULTI-SELECT FILTER (estilo Excel) ───────────────────────────────────
function MultiSelectFilter({label,options,value,onChange,style}){
  var [open,setOpen]=useState(false);
  var ref=useRef(null);
  useEffect(function(){
    function onOut(e){if(ref.current&&!ref.current.contains(e.target))setOpen(false);}
    document.addEventListener('mousedown',onOut);
    return function(){document.removeEventListener('mousedown',onOut);};
  },[]);
  var isAll=value.length===0;
  function toggle(opt){
    if(isAll){
      // estava mostrando tudo: desmarcar este → mostrar todos exceto ele
      var next=options.filter(function(o){return o!==opt;});
      onChange(next.length===options.length?[]:next);
    }else{
      var inc=value.includes(opt);
      var next2=inc?value.filter(function(o){return o!==opt;}):value.concat([opt]);
      // se todos estão selecionados novamente → reset
      onChange(next2.length>=options.length?[]:next2);
    }
  }
  return h('div',{ref:ref,style:Object.assign({position:'relative',display:'inline-block',userSelect:'none'},style||{})},
    h('button',{
      className:'btn btn-outline btn-sm',
      onClick:function(e){e.stopPropagation();setOpen(function(v){return!v;});},
      style:{whiteSpace:'nowrap',background:!isAll?'#faf7f8':'#fff',borderColor:!isAll?'#651D32':'#d9bcc6',color:'#651D32'}
    },
      label,
      !isAll?h('span',{style:{marginLeft:4,background:'#651D32',color:'#fff',borderRadius:10,fontSize:10,padding:'1px 5px',lineHeight:'1.4'}},value.length):null,
      h('span',{style:{marginLeft:4,fontSize:9,opacity:.6}},open?'▲':'▼')
    ),
    open?h('div',{style:{
      position:'absolute',top:'calc(100% + 4px)',left:0,zIndex:300,
      background:'#fff',border:'1px solid #e2d8df',borderRadius:8,
      boxShadow:'0 4px 20px rgba(0,0,0,.14)',minWidth:210,maxHeight:280,overflowY:'auto',padding:'4px 0'
    }},
      h('label',{style:{display:'flex',alignItems:'center',gap:8,padding:'6px 12px',cursor:'pointer',fontSize:12,fontWeight:600,borderBottom:'1px solid #fbf1f4',color:'#651D32'}},
        h('input',{type:'checkbox',checked:isAll,onChange:function(){onChange([]);},style:{width:'auto',cursor:'pointer'}}),
        '(Todos — '+options.length+')'
      ),
      options.map(function(opt){
        var sel=isAll||value.includes(opt);
        return h('label',{key:opt,style:{display:'flex',alignItems:'center',gap:8,padding:'5px 12px',cursor:'pointer',fontSize:12,background:(!isAll&&sel)?'#fbf1f4':'#fff'}},
          h('input',{type:'checkbox',checked:sel,onChange:function(){toggle(opt);},style:{width:'auto',cursor:'pointer'}}),
          h('span',{style:{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:175}},opt)
        );
      })
    ):null
  );
}

function PainelExecutivo({sugestoes,fornecedores,pedidos,setTab}){
  // Deduplica por cod (multi-depósito) antes de qualquer cálculo
  var sugDedup=useMemo(function(){
    var m={};
    sugestoes.forEach(function(s){
      var c=s.cod;if(!c)return;
      if(!m[c]){m[c]=Object.assign({},s,{_estSum:0,_medSum:0,_cobErp:0});}
      m[c]._estSum+=(s.estoque||0);
      m[c]._medSum+=(s.media_diaria||0);
      if((s.dias_cobertura||0)>m[c]._cobErp)m[c]._cobErp=s.dias_cobertura||0;
      if((s.receita_periodo||0)>0)m[c].receita_periodo=(m[c].receita_periodo||0)+(s.receita_periodo||0);
      if((s.qtd_vendida||0)>0)m[c].qtd_vendida=(m[c].qtd_vendida||0)+(s.qtd_vendida||0);
      if((s.custo_unit||0)>0)m[c].custo_unit=s.custo_unit;
      if((s.preco_unit||0)>0)m[c].preco_unit=s.preco_unit;
      if((s.margem_pct||0)>0)m[c].margem_pct=s.margem_pct;
      if((s.sugestao_pedido||0)>0)m[c].sugestao_pedido=(m[c].sugestao_pedido||0)+(s.sugestao_pedido||0);
      if((s.valor_pedido||0)>0)m[c].valor_pedido=(m[c].valor_pedido||0)+(s.valor_pedido||0);
      if(s.fornecedor_nome&&!m[c].fornecedor_nome)m[c].fornecedor_nome=s.fornecedor_nome;
      if(s.media_fonte==='historico')m[c].media_fonte='historico';
    });
    return Object.values(m).map(function(s){
      var est=s._estSum;var med=s._medSum;
      var cob=med>0?Math.max(0,Math.round(est/med)):s._cobErp;
      return Object.assign({},s,{estoque:est,media_diaria:med,dias_cobertura:cob});
    });
  },[sugestoes]);

  var abcMap=useMemo(function(){
    var items=sugDedup.map(function(s){
      var c=s.custo_unit||0;
      var v=(s.sugestao_pedido||0)>0?(s.sugestao_pedido*c):(s.estoque||0)*c;
      return{id:s.id,v:v};
    }).filter(function(x){return x.v>0;}).sort(function(a,b){return b.v-a.v;});
    var tot=items.reduce(function(a,x){return a+x.v;},0);
    var cum=0,m={};
    items.forEach(function(x){cum+=x.v;var p=tot>0?cum/tot*100:0;m[x.id]=p<=80?'A':p<=95?'B':'C';});
    return m;
  },[sugDedup]);

  var kpis=useMemo(function(){
    var at=sugDedup.filter(function(s){return s.status!=='INATIVO';});
    var semEst=at.filter(function(s){return(s.estoque||0)<=0;}).length;
    var repor=at.filter(function(s){var e=s.estoque||0,d=s.dias_cobertura||0;return e>0&&d>0&&d<30;}).length;
    var ok=at.filter(function(s){var e=s.estoque||0,d=s.dias_cobertura||0;return e>0&&d>=30;}).length;
    var withCov=at.filter(function(s){return(s.dias_cobertura||0)>0;});
    var cobMedia=withCov.length?withCov.reduce(function(a,s){return a+(s.dias_cobertura||0);},0)/withCov.length:0;
    var valSug=at.filter(function(s){return(s.sugestao_pedido||0)>0;}).reduce(function(a,s){return a+(s.valor_pedido||0);},0);
    var fAtivos=fornecedores.filter(function(f){return f.ativo!==false;}).length;
    var ocAbertas=pedidos.filter(function(p){return p.status!=='Recebido'&&p.status!=='Cancelado';}).length;
    var valEst=at.filter(function(s){return(s.estoque||0)>0;}).reduce(function(a,s){return a+(s.estoque||0)*(s.custo_unit||0);},0);
    var ruptA=at.filter(function(s){return(s.estoque||0)<=0&&abcMap[s.id]==='A';}).length;
    var recRisco=at.filter(function(s){return(s.estoque||0)<=0;}).reduce(function(a,s){return a+(s.media_diaria||0)*(s.preco_unit||s.preco_venda||0);},0);
    return{total:at.length,semEst,repor,ok,cobMedia,valSug,fAtivos,
      pctRup:at.length?semEst/at.length*100:0,ocAbertas,valEst,ruptA,recRisco,
      skuPos:at.filter(function(s){return(s.estoque||0)>0;}).length};
  },[sugDedup,fornecedores,pedidos,abcMap]);

  var abcData=useMemo(function(){
    var r={A:{n:0,v:0},B:{n:0,v:0},C:{n:0,v:0}};
    sugDedup.forEach(function(s){
      var cls=abcMap[s.id];if(!cls)return;
      var c=s.custo_unit||0;
      var v=(s.sugestao_pedido||0)>0?(s.sugestao_pedido*c):(s.estoque||0)*c;
      r[cls].n++;r[cls].v+=v;
    });
    return Object.assign({},r,{total:r.A.v+r.B.v+r.C.v});
  },[sugDedup,abcMap]);

  var urgentes=useMemo(function(){
    var ord={A:0,B:1,C:2};
    return sugDedup
      .filter(function(s){var d=s.dias_cobertura||0,e=s.estoque||0;return e<=0||(d>0&&d<15);})
      .map(function(s){var cls=abcMap[s.id]||'C';return Object.assign({},s,{_cls:cls,_imp:(s.media_diaria||0)*(s.preco_unit||s.preco_venda||s.custo_unit||0)});})
      .sort(function(a,b){var ca=ord[a._cls]||2,cb=ord[b._cls]||2;if(ca!==cb)return ca-cb;return b._imp-a._imp||((a.dias_cobertura||0)-(b.dias_cobertura||0));})
      .slice(0,12);
  },[sugDedup,abcMap]);

  var topVendidos=useMemo(function(){
    return sugDedup
      .map(function(s){
        var rec=s.receita_periodo||((s.media_diaria||0)*(s.periodo_dias||128)*(s.preco_unit||s.preco_venda||0));
        return Object.assign({},s,{_cls:abcMap[s.id]||'C',_rec:rec});
      })
      .filter(function(s){return s._rec>0;})

// ── PARSER HISTÓRICO DE PEDIDOS ───────────────────────────────────────────
var _COL_HIST={
  cod:       ['cód.','cod.','código','codigo','cod','sku','ref','referência','item'],
  qtd:       ['quantidade','qtd','qty','quant.','qtd. pedida','quantidade pedida','qtd pedida','qtd comprada','quant. comprada','qtd. comprada'],
  data:      ['data','data pedido','data do pedido','emissão','emissao','dt.','dt emissao','data emissão','data nota','data nf'],
  custo_tot: ['custo total','total custo','cst total','vlr custo total','custo tot.','custo tot'],
  preco_tot: ['preço total','preco total','total venda','receita','faturamento','vlr venda','preco tot','precio total'],
  produto:   ['nome','produto','descrição','descricao','item','description']
};
function _findColHist(headers,field){
  var cands=_COL_HIST[field]||[field];
  var nc=cands.map(function(c){return norm(c);});
  // Passe 1: exato
  for(var i=0;i<headers.length;i++){var hn=norm(String(headers[i]));for(var j=0;j<nc.length;j++){if(hn===nc[j])return headers[i];}}
  // Passe 2: parcial
  for(var i=0;i<headers.length;i++){var hn=norm(String(headers[i]));for(var j=0;j<nc.length;j++){if(hn.includes(nc[j]))return headers[i];}}
  return null;
}
function parseHistoricoPedidos(file){
  return new Promise(function(resolve,reject){
    var reader=new FileReader();
    reader.onload=function(e){
      try{
        var data=new Uint8Array(e.target.result);
        var wb=XLSX.read(data,{type:'array',raw:false,cellDates:true});
        var agg={};
        // Detectar período pelo nome do arquivo (ex: "Jan ate 09.05.2026")
        var periodoDefault=128;
        var fnMatch=(file.name||'').match(/(\d{2})[./](\d{2})[./](\d{4})/);
        if(fnMatch){
          var endDate=new Date(parseInt(fnMatch[3]),parseInt(fnMatch[2])-1,parseInt(fnMatch[1]));
          var janFirst=new Date(endDate.getFullYear(),0,1);
          var diff=Math.round((endDate-janFirst)/86400000);
          if(diff>30&&diff<365)periodoDefault=diff;
        }
        wb.SheetNames.forEach(function(sn){
          var ws=wb.Sheets[sn];
          for(var range=0;range<=4;range++){
            var rows=[];
            try{rows=XLSX.utils.sheet_to_json(ws,{raw:false,defval:'',range:range});}catch(e){continue;}
            if(!rows.length)continue;
            var keys=Object.keys(rows[0]);
            var codC=_findColHist(keys,'cod');
            var qtdC=_findColHist(keys,'qtd');
            if(!codC||!qtdC)continue;
            var dataC=_findColHist(keys,'data');
            var custTotC=_findColHist(keys,'custo_tot');
            var precTotC=_findColHist(keys,'preco_tot');
            var prodC=_findColHist(keys,'produto');
            rows.forEach(function(row){
              var cod=String(row[codC]||'').trim();
              var qtd=parseNum(row[qtdC]);
              if(!cod||qtd<=0||norm(cod).startsWith('cod')||norm(cod).startsWith('tot'))return;
              if(!agg[cod])agg[cod]={total:0,custo:0,preco:0,minD:Infinity,maxD:-Infinity,n:0,produto:''};
              agg[cod].total+=qtd;
              agg[cod].n++;
              if(custTotC)agg[cod].custo+=parseNum(row[custTotC]||0);
              if(precTotC)agg[cod].preco+=parseNum(row[precTotC]||0);
              if(prodC&&!agg[cod].produto)agg[cod].produto=String(row[prodC]||'').trim();
              if(dataC&&row[dataC]){
                var d=new Date(row[dataC]);
                if(!isNaN(d.getTime())){agg[cod].minD=Math.min(agg[cod].minD,d.getTime());agg[cod].maxD=Math.max(agg[cod].maxD,d.getTime());}
              }
            });
            break;
          }
        });
        var result=Object.keys(agg).map(function(cod){
          var a=agg[cod];
          var dias=a.maxD>a.minD?Math.max(30,Math.round((a.maxD-a.minD)/86400000)):periodoDefault;
          var media=Math.round(a.total/dias*1000)/1000;
          var custo_unit=a.total>0&&a.custo>0?Math.round(a.custo/a.total*100)/100:0;
          return{cod:cod,produto:a.produto,media_diaria:media,total:a.total,periodo_dias:dias,
                 custo_unit:custo_unit,custo_total:a.custo,preco_total:a.preco};
        });
        resolve(result);
      }catch(err){reject(err);}
    };
    reader.onerror=function(){reject(new Error('Falha ao ler arquivo'));};
    reader.readAsArrayBuffer(file);
  });
}

function SugestoesCompras({sugestoes,setSugestoes,pedidos,setPedidos,setTab,showToast}){
  var [filtFornList,setFiltFornList]=useState([]);
  var [filtDeposito,setFiltDeposito]=useState([]);
  var [filtStatus,setFiltStatus]=useState('');
  var [busca,setBusca]=useState('');
  var [importing,setImporting]=useState(false);
  var [importMsg,setImportMsg]=useState('');
  var [showModal,setShowModal]=useState(false);
  var [dragOver,setDragOver]=useState(false);
  var [mergeMode,setMergeMode]=useState(false);
  var [deposito,setDeposito]=useState('Geral');
  var [selected,setSelected]=useState({});
  var [diasAlvo,setDiasAlvo]=useState(45);
  var [diasCustom,setDiasCustom]=useState('');
  var [showCalc,setShowCalc]=useState(false);
  var [editingId,setEditingId]=useState(null);
  var [editQtd,setEditQtd]=useState('');
  var [histModal,setHistModal]=useState(false);
  var [histImporting,setHistImporting]=useState(false);
  var [histMsg,setHistMsg]=useState('');
  var [sortBySug,setSortBySug]=useState('cobertura');
  var fileRef=useRef(null);var histRef=useRef(null);

  var fornList=useMemo(function(){
    var s=new Set(sugestoes.map(function(x){return x.fornecedor_nome||'Sem Fornecedor';}));
    return Array.from(s).sort();
  },[sugestoes]);
  var depositoList=useMemo(function(){
    var s=new Set(sugestoes.map(function(x){return x.deposito||'Geral';}));
    return Array.from(s).sort();
  },[sugestoes]);

  // Enriquece cada item com cobertura e status recalculados (não depende do ERP)
  var sugsEnriched=useMemo(function(){
    var meta=diasCustom&&Number(diasCustom)>0?Number(diasCustom):diasAlvo;
    return sugestoes.map(function(s){
      var est=s.estoque||0;var med=s.media_diaria||0;
      var cobErp=s.dias_cobertura||0;
      var cob=med>0?Math.max(0,Math.round(est/med)):cobErp;
      var semDados=est>0&&med<=0&&cob<=0;
      var st=est<=0?'SEM ESTOQUE':semDados?'SEM DADOS':cob<15?'CRÍTICO':cob<30?'REPOR':'OK';
      // sugestão automática para itens com cobertura < meta e sem override
      var autoSug=0;
      if(!s.manual_override&&(s.sugestao_pedido||0)===0&&med>0&&(est<=0||cob<meta)){
        autoSug=Math.max(0,Math.ceil(med*meta)-est);
      }
      var sugFinal=s.sugestao_pedido||autoSug;
      var valFinal=sugFinal>0&&(s.custo_unit||0)>0?sugFinal*s.custo_unit:(s.valor_pedido||0);
      return Object.assign({},s,{_cob:cob,_status:st,_autoSug:autoSug>0&&!(s.sugestao_pedido>0),sugestao_pedido:sugFinal,valor_pedido:valFinal});
    });
  },[sugestoes,diasAlvo,diasCustom]);

  var filtered=useMemo(function(){
    var base=sugsEnriched.filter(function(s){
      if(filtFornList.length>0&&!filtFornList.includes(s.fornecedor_nome||'Sem Fornecedor'))return false;
      if(filtDeposito.length>0&&!filtDeposito.includes(s.deposito||'Geral'))return false;
      if(filtStatus){if(filtStatus==='REPOR'){if(s._status!=='REPOR'&&s._status!=='CRÍTICO')return false;}else{if(s._status!==filtStatus)return false;}}
      if(busca){var b=norm(busca);if(!norm(s.produto).includes(b)&&!norm(s.cod).includes(b))return false;}
      return true;
    });
    if(sortBySug==='valor_desc')return base.slice().sort(function(a,b){return(b.valor_pedido||0)-(a.valor_pedido||0);});
    if(sortBySug==='sug_desc') return base.slice().sort(function(a,b){return(b.sugestao_pedido||0)-(a.sugestao_pedido||0);});
    if(sortBySug==='estoque_asc')return base.slice().sort(function(a,b){return(a.estoque||0)-(b.estoque||0);});
    if(sortBySug==='abc')return base.slice().sort(function(a,b){
      var va=(a.sugestao_pedido||0)>0?(a.sugestao_pedido*(a.custo_unit||0)):(a.estoque||0)*(a.custo_unit||0);
      var vb=(b.sugestao_pedido||0)>0?(b.sugestao_pedido*(b.custo_unit||0)):(b.estoque||0)*(b.custo_unit||0);
      return vb-va;
    });
    return base.slice().sort(function(a,b){return(a._cob||0)-(b._cob||0);});
  },[sugsEnriched,filtFornList,filtDeposito,filtStatus,busca,sortBySug]);

  var stats=useMemo(function(){
    var se=sugsEnriched.filter(function(s){return s._status==='SEM ESTOQUE';}).length;
    var rp=sugsEnriched.filter(function(s){return s._status==='REPOR'||s._status==='CRÍTICO';}).length;

  // ── Recalcular sugestões pela fórmula: ceil(média × diasAlvo) – estoque ──
  function recalcular(somenteSemQtd){
    var meta=diasCustom&&Number(diasCustom)>0?Number(diasCustom):diasAlvo;
    var atualizados=0;
    var semMedia=0;
    var novos=sugestoes.map(function(s){
      if(s.manual_override)return s;
      if(somenteSemQtd&&(s.sugestao_pedido||0)>0)return s;
      var media=s.media_diaria||0;
      if(media<=0){semMedia++;return s;}
      var sug=Math.max(0,Math.ceil(media*meta)-(s.estoque||0));
      var val=sug>0&&s.custo_unit>0?sug*s.custo_unit:0;
      atualizados++;
      return Object.assign({},s,{sugestao_pedido:sug,valor_pedido:val});
    });
    setSugestoes(novos);store.set('sugestoes',novos);
    showToast('✅ '+atualizados+' sugestões recalculadas (meta '+meta+'d). '+semMedia+' sem média diária.');
  }

          media_diaria:h.media_diaria,media_fonte:'historico',
          periodo_dias:h.periodo_dias,

// ── ESTOQUE & ALERTAS ─────────────────────────────────────────────────────
function EstoqueAlertas({sugestoes,setSugestoes}){
  var [filtAlerta,setFiltAlerta]=useState('');
  var [filtFornList,setFiltFornList]=useState([]);
  var [filtDeposito,setFiltDeposito]=useState([]);
  var [busca,setBusca]=useState('');
  var [sortBy,setSortBy]=useState('cobertura');
  var [buscaPos,setBuscaPos]=useState('');
  var [importingDep,setImportingDep]=useState(null);
  var [importMsg,setImportMsg]=useState('');
  var fileRS=useRef(null);var fileBo=useRef(null);

  async function handleImport(file,dep){
    if(!file)return;
    setImportingDep(dep);setImportMsg('');
    try{
      var itens=await parseExcel(file);
      if(!itens.length){setImportMsg('⚠ Nenhum item encontrado em '+dep+'. Verifique o formato.');return;}
      var tagged=itens.map(function(x){return Object.assign({},x,{deposito:dep});});
      var key=function(x){return x.cod+'::'+(x.deposito||'Geral');};
      var codsImport=new Set(tagged.map(function(x){return x.cod;}));
      var newByKey={};tagged.forEach(function(x){newByKey[key(x)]=x;});
      var kept=(sugestoes||[]).filter(function(x){
        if(newByKey[key(x)])return false;
        if((x.deposito||'Geral')==='Geral'&&codsImport.has(x.cod))return false;
        return true;
      });
      var final=kept.concat(tagged);
      setSugestoes(final);store.set('sugestoes',final);
      setImportMsg('✓ '+dep+': '+tagged.length+' itens importados!');
      setTimeout(function(){setImportMsg('');},3000);
    }catch(e){setImportMsg('Erro ('+dep+'): '+e.message);}finally{setImportingDep(null);}
  }

  var fornList=useMemo(function(){var s=new Set(sugestoes.map(function(x){return x.fornecedor_nome||'Sem Fornecedor';}));return Array.from(s).sort();},[sugestoes]);
  var depositoList=useMemo(function(){var s=new Set(sugestoes.map(function(x){return x.deposito||'Geral';}));return Array.from(s).sort();},[sugestoes]);

  // Agrega estoque por SKU (cod) — elimina duplicatas de importações multi-depósito
  var dedupedSug=useMemo(function(){
    var m={};
    sugestoes.forEach(function(s){
      var c=s.cod;if(!c)return;
      if(!m[c]){m[c]=Object.assign({},s,{_estSum:0,_medSum:0,_cobErp:0,_deps:[]});}
      m[c]._estSum+=(s.estoque||0);
      m[c]._medSum+=(s.media_diaria||0);
      if((s.dias_cobertura||0)>m[c]._cobErp)m[c]._cobErp=s.dias_cobertura||0;
      var dn=s.deposito||'Geral';if(!m[c]._deps.includes(dn))m[c]._deps.push(dn);
      if(s.media_fonte&&s.media_fonte!=='erp')m[c].media_fonte=s.media_fonte;
      if((s.custo_unit||0)>0)m[c].custo_unit=s.custo_unit;
      if(s.fornecedor_nome&&!m[c].fornecedor_nome)m[c].fornecedor_nome=s.fornecedor_nome;
      if((s.sugestao_pedido||0)>0&&!(m[c].sugestao_pedido>0))m[c].sugestao_pedido=s.sugestao_pedido;
    });
    return Object.values(m).map(function(s){
      var est=s._estSum;var med=s._medSum;
      var cob=med>0?Math.max(0,Math.round(est/med)):s._cobErp;
      var semDados=est>0&&med<=0&&cob<=0;
      var st=est<=0?'SEM ESTOQUE':semDados?'SEM DADOS':cob<15?'CRÍTICO':cob<30?'REPOR':'OK';
      return Object.assign({},s,{
        estoque:est,media_diaria:med,dias_cobertura:cob,status:st,
        deposito:s._deps.length>1?s._deps.join(' + '):s._deps[0]||'Geral'
      });
    });
  },[sugestoes]);

  var kpis=useMemo(function(){
    var comEst=dedupedSug.filter(function(s){return(s.estoque||0)>0;});
    var semEst=dedupedSug.filter(function(s){return(s.estoque||0)<=0;});
    var valorTotal=comEst.reduce(function(a,s){return a+(s.estoque||0)*(s.custo_unit||0);},0);
    return{comEst:comEst.length,semEst:semEst.length,valorTotal:valorTotal,pctRuptura:dedupedSug.length>0?Math.round(semEst.length/dedupedSug.length*100):0};
  },[dedupedSug]);

  var stats=useMemo(function(){
    var c=dedupedSug.filter(function(s){return(s.estoque||0)<=0;}).length;
    var a=dedupedSug.filter(function(s){var d=s.dias_cobertura||0;return d>0&&d<30;}).length;
    var o=dedupedSug.filter(function(s){return(s.dias_cobertura||0)>=30;}).length;
    return{c,a,o};
  },[dedupedSug]);

  var {posItems,zeroItems}=useMemo(function(){
    var base=dedupedSug.filter(function(s){
      var d=s.dias_cobertura||0;
      if(filtAlerta==='critico'&&(s.estoque||0)>0)return false;
      if(filtAlerta==='alerta'&&(d<=0||d>=30))return false;
      if(filtAlerta==='ok'&&d<30)return false;
      if(filtFornList.length>0&&!filtFornList.includes(s.fornecedor_nome||'Sem Fornecedor'))return false;
      if(filtDeposito.length>0&&!filtDeposito.includes(s.deposito||'Geral'))return false;
      if(busca){var b=norm(busca);if(!norm(s.produto).includes(b)&&!norm(s.cod).includes(b))return false;}
      return true;
    });
    var pos=base.filter(function(s){return(s.estoque||0)>0;});
    var zero=base.filter(function(s){return(s.estoque||0)<=0;});
    if(sortBy==='estoque_desc')pos.sort(function(a,b){return(b.estoque||0)-(a.estoque||0);});

    else if(sortBy==='az')pos.sort(function(a,b){return norm(a.produto).localeCompare(norm(b.produto));});
    else if(sortBy==='za')pos.sort(function(a,b){return norm(b.produto).localeCompare(norm(a.produto));});
    else pos.sort(function(a,b){return(a.dias_cobertura||0)-(b.dias_cobertura||0);});
    zero.sort(function(a,b){return norm(a.produto).localeCompare(norm(b.produto));});
    return{posItems:pos,zeroItems:zero};

  var pills=[{v:'',l:'Todos',c:'#651D32',bg:'#faf7f8'},{v:'critico',l:'🔴 Crítico ('+stats.c+')',c:'#C0392B',bg:'#FDECEA'},{v:'alerta',l:'🟡 Alerta ('+stats.a+')',c:'#D68910',bg:'#FEF9E7'},{v:'ok',l:'🟢 OK ('+stats.o+')',c:'#1E8449',bg:'#EAFAF1'}];

      h('td',null,s.un),
      h('td',{style:{textAlign:'right',fontWeight:700,color:'#2D3436'}},fmt0(s.estoque)),
      h('td',{style:{textAlign:'right',color:'#2E86C1',fontWeight:500}},valorEst>0?fmt$(valorEst):'—'),
      h('td',{style:{textAlign:'right',fontWeight:700,color:semDados?'#888':(s.estoque||0)<=0?'#C0392B':d<15?'#C0392B':d<30?'#D68910':'#27AE60'}},semDados?'—':(s.estoque||0)<=0?h('b',null,'ZERO'):fmt1(d)+'d'),
      h('td',{style:{textAlign:'right'}},s.media_diaria>0?fmt1(s.media_diaria):'—'),

  var posVal=posItems.reduce(function(a,s){return a+(s.estoque||0)*(s.custo_unit||0);},0);

  return h('div',{style:{padding:24}},

// ── PEDIDOS EM ABERTO — OC COMPLETA ───────────────────────────────────────
function PedidosAbertos({pedidos,setPedidos,fornecedores,showToast}){
  var [filtStatus,setFiltStatus]=useState('');
  var [busca,setBusca]=useState('');
  var [viewMode,setViewMode]=useState('kanban');
  var [expandId,setExpandId]=useState(null);
  var [editModal,setEditModal]=useState(null);
  var [editForm,setEditForm]=useState({});

  var STATUSES=OC_FLOW.concat(['Divergência','Cancelado']);

  var filtered=useMemo(function(){
    return pedidos.filter(function(p){
      if(filtStatus&&p.status!==filtStatus)return false;
      if(busca){var b=norm(busca);if(!norm(p.id).includes(b)&&!norm(p.fornecedor_nome||'').includes(b))return false;}
      return true;
    }).sort(function(a,b){return new Date(b.data_emissao||0)-new Date(a.data_emissao||0);});
  },[pedidos,filtStatus,busca]);

  var totais=useMemo(function(){var t={};STATUSES.forEach(function(s){t[s]=pedidos.filter(function(p){return p.status===s;}).length;});return t;},[pedidos]);
  var valAberto=pedidos.filter(function(p){return p.status!=='Recebido'&&p.status!=='Cancelado';}).reduce(function(a,p){return a+(p.valor_total||0);},0);

  function changeStatus(id,newStatus){
    var now=new Date().toISOString();
    var arr=pedidos.map(function(p){
      if(p.id!==id)return p;
      var hist=(p.historico||[]).concat([{status:newStatus,data:now,user:_curEmail||''}]);
      var extra={};
      if(newStatus==='OC Enviada')extra.data_envio=now.slice(0,10);
      if(newStatus==='Recebido')extra.data_recebimento=now.slice(0,10);
      return Object.assign({},p,{status:newStatus,historico:hist},extra);
    });
    setPedidos(arr);store.set('pedidos',arr);
    showToast('Status atualizado para "'+newStatus+'"');
  }

  function del(id){
    if(!confirm('Excluir OC '+id+'?'))return;
    var arr=pedidos.filter(function(p){return p.id!==id;});
    setPedidos(arr);store.set('pedidos',arr);
  }

  function openEdit(p){
    setEditForm(Object.assign({},p,{
      itens:(p.itens||[]).map(function(i){return Object.assign({},i);})
    }));
    setEditModal(p.id);
  }

  function saveEdit(){
    var arr=pedidos.map(function(p){return p.id===editForm.id?Object.assign({},editForm):p;});
    setPedidos(arr);store.set('pedidos',arr);setEditModal(null);
    showToast('OC '+editForm.id+' atualizada.');
  }

  function updEditItem(idx,k,v){
    setEditForm(function(prev){
      var itens=prev.itens.map(function(it,i){

// ── VALIDADES PARSER ──────────────────────────────────────────────────────
var _COL_VAL={
  cod:      ['cód.','cod.','código','codigo','cod','sku','ref','item'],
  produto:  ['produto','descrição','descricao','item','desc.','nome'],
  lote:     ['lote','n° lote','num lote','n.lote','lot','numero lote'],
  validade: ['validade','data validade','vencimento','venc.','dt.venc','data venc','val.','dt validade'],
  qtd:      ['quantidade','qtd','qty','saldo','estoque','quant'],
  deposito: ['depósito','deposito','filial','armazém','armazem','local','cd']
};
function _findValCol(headers,field){
  var cands=_COL_VAL[field]||[field];
  for(var i=0;i<headers.length;i++){var hn=norm(String(headers[i]));for(var j=0;j<cands.length;j++){if(hn===norm(cands[j])||hn.includes(norm(cands[j])))return headers[i];}}
  return null;
}
function parseValidades(file){
  return new Promise(function(resolve,reject){
    var reader=new FileReader();
    reader.onload=function(e){
      try{
        var data=new Uint8Array(e.target.result);
        var wb=XLSX.read(data,{type:'array',raw:false,cellDates:true});
        var all=[];
        wb.SheetNames.forEach(function(sn){
          var ws=wb.Sheets[sn];
          for(var range=0;range<=4;range++){
            var rows=[];
            try{rows=XLSX.utils.sheet_to_json(ws,{raw:false,defval:'',range:range});}catch(e){continue;}
            if(!rows.length)continue;
            var keys=Object.keys(rows[0]);
            var valC=_findValCol(keys,'validade');
            if(!valC)continue;
            var codC=_findValCol(keys,'cod');
            var prodC=_findValCol(keys,'produto');
            var loteC=_findValCol(keys,'lote');
            var qtdC=_findValCol(keys,'qtd');
            var depC=_findValCol(keys,'deposito');
            rows.forEach(function(row){
              var vs=String(row[valC]||'').trim();
              if(!vs)return;
              var vd=null;
              var m=vs.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
              if(m){var y=m[3].length===2?'20'+m[3]:m[3];vd=new Date(y+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0'));}
              else{vd=new Date(vs);}
              if(!vd||isNaN(vd.getTime()))return;
              var diasR=Math.round((vd-new Date())/(86400000));
              all.push({
                id:uid(),
                cod:codC?String(row[codC]||'').trim():'',
                produto:prodC?String(row[prodC]||'').trim():'Sem descrição',
                lote:loteC?String(row[loteC]||'').trim():'—',
                validade:vd.toISOString().slice(0,10),
                qtd:qtdC?parseNum(row[qtdC]):0,
                deposito:depC?String(row[depC]||'').trim():'Geral',
                dias_restantes:diasR
              });
            });
            break;
          }
        });
        resolve(all);
      }catch(err){reject(err);}
    };
    reader.onerror=function(){reject(new Error('Falha ao ler arquivo'));};
    reader.readAsArrayBuffer(file);
  });
}

// ── VALIDADES & LOTES ─────────────────────────────────────────────────────
function ValidadesModule({validades,setValidades}){
  var [importing,setImporting]=useState(false);
  var [importMsg,setImportMsg]=useState('');
  var [dragOver,setDragOver]=useState(false);
  var [filtAlerta,setFiltAlerta]=useState('');
  var [filtFornList,setFiltFornList]=useState([]);
  var [filtDeposito,setFiltDeposito]=useState([]);
  var [busca,setBusca]=useState('');
  var fileRef=useRef(null);

  async function handleFile(file){
    if(!file)return;
    setImporting(true);setImportMsg('Processando…');
    try{
      var itens=await parseValidades(file);
      if(!itens.length){setImportMsg('⚠ Nenhum lote encontrado. Verifique o formato.');return;}
      setValidades(itens);store.set('validades',itens);
      setImportMsg('✓ '+itens.length+' lotes importados!');
      setTimeout(function(){setImportMsg('');},2500);
    }catch(e){setImportMsg('Erro: '+e.message);}finally{setImporting(false);}
  }

  var stats=useMemo(function(){
    var vencido=validades.filter(function(v){return v.dias_restantes<0;}).length;
    var critico=validades.filter(function(v){return v.dias_restantes>=0&&v.dias_restantes<=30;}).length;
    var atencao=validades.filter(function(v){return v.dias_restantes>30&&v.dias_restantes<=90;}).length;
    var ok=validades.filter(function(v){return v.dias_restantes>90;}).length;
    return{vencido,critico,atencao,ok};
  },[validades]);

  var prodList=useMemo(function(){var s=new Set(validades.map(function(v){return v.produto;}));return Array.from(s).sort();},[validades]);
  var depList=useMemo(function(){var s=new Set(validades.map(function(v){return v.deposito||'Geral';}));return Array.from(s).sort();},[validades]);

  var filtered=useMemo(function(){
    return validades.filter(function(v){
      if(filtAlerta==='vencido'&&v.dias_restantes>=0)return false;
      if(filtAlerta==='critico'&&(v.dias_restantes<0||v.dias_restantes>30))return false;
      if(filtAlerta==='atencao'&&(v.dias_restantes<=30||v.dias_restantes>90))return false;
      if(filtAlerta==='ok'&&v.dias_restantes<=90)return false;
      if(filtFornList.length>0&&!filtFornList.includes(v.produto))return false;
      if(filtDeposito.length>0&&!filtDeposito.includes(v.deposito||'Geral'))return false;
      if(busca){var b=norm(busca);if(!norm(v.produto).includes(b)&&!norm(v.cod).includes(b)&&!norm(v.lote).includes(b))return false;}
      return true;
    }).sort(function(a,b){return a.dias_restantes-b.dias_restantes;});
  },[validades,filtAlerta,filtFornList,filtDeposito,busca]);

  function semaforo(d){
    if(d<0)return{icon:'⛔',cls:'badge-purple',txt:'VENCIDO'};
    if(d<=30)return{icon:'🔴',cls:'badge-red',txt:d+'d'};
    if(d<=90)return{icon:'🟡',cls:'badge-yellow',txt:d+'d'};
    return{icon:'🟢',cls:'badge-green',txt:d+'d'};
  }

  var alertaCards=[
    {v:'vencido',n:stats.vencido,lbl:'Vencidos',col:'#7D3C98',bg:'#F4ECF7'},

// ── ANÁLISES ──────────────────────────────────────────────────────────────
function AnaliseModule({sugestoes,setTab}){
  var [subTab,setSubTab]=useState('fornecedor');
  var [abcPage,setAbcPage]=useState(0);
  var ABC_PAGE=50;

  var analForn=useMemo(function(){
    var m={};
    sugestoes.forEach(function(s){
      if((s.sugestao_pedido||0)<=0)return;
      var fn=s.fornecedor_nome||'Sem Fornecedor';
      if(!m[fn])m[fn]={nome:fn,itens:0,valor:0};
      m[fn].itens++;m[fn].valor+=(s.valor_pedido||0);
    });
    return Object.values(m).sort(function(a,b){return b.valor-a.valor;});
  },[sugestoes]);

  var totalSug=analForn.reduce(function(a,b){return a+b.valor;},0);

  var analABC=useMemo(function(){
    var items=sugestoes.map(function(s){
      var custo=s.custo_unit||0;
      // Calcular sempre a partir das quantidades × custo, nunca de valor_pedido (pode estar sujo)
      var val=(s.sugestao_pedido||0)>0?(s.sugestao_pedido*custo):(s.estoque||0)*custo;
      return Object.assign({},s,{_val:val});
    }).filter(function(s){return s._val>0;}).sort(function(a,b){return b._val-a._val;});
    var total=items.reduce(function(a,s){return a+s._val;},0);
    var cum=0;
    return items.map(function(s,i){
      cum+=s._val;
      var pct=total>0?cum/total*100:0;
      return Object.assign({},s,{rank:i+1,pct_cum:Math.round(pct*10)/10,classe:pct<=80?'A':pct<=95?'B':'C'});
    });
  },[sugestoes]);

  var analPeriodo=useMemo(function(){
    var bands=[
      {id:'zero',label:'Sem estoque',  min:-1,max:-1,color:'#C0392B',bg:'#FDECEA',emoji:'🔴'},
      {id:'d15', label:'< 15 dias',    min:0, max:15, color:'#E74C3C',bg:'#FDECEA',emoji:'🔴'},
      {id:'d30', label:'15 – 30 dias', min:15,max:30, color:'#D68910',bg:'#FEF9E7',emoji:'🟡'},
      {id:'d45', label:'30 – 45 dias', min:30,max:45, color:'#27AE60',bg:'#EAFAF1',emoji:'🟢'},
      {id:'d60', label:'45 – 60 dias', min:45,max:60, color:'#1E8449',bg:'#D5F5E3',emoji:'🟢'},
      {id:'ok',  label:'> 60 dias',    min:60,max:9999,color:'#148A71',bg:'#D1F2EB',emoji:'✅'},
    ];
    return bands.map(function(b){
      var itens=sugestoes.filter(function(s){
        var est=s.estoque||0;var d=s.dias_cobertura||0;
        if(b.id==='zero')return est<=0;
        if(est<=0)return false;
        return d>=b.min&&d<b.max;
      });
      var valor=itens.reduce(function(a,s){return a+(s.sugestao_pedido||0)*(s.custo_unit||0);},0);
      return Object.assign({},b,{itens:itens,count:itens.length,valor:valor});
    });
  },[sugestoes]);

  var abcClr={A:{bg:'#FEF9E7',c:'#D68910'},B:{bg:'#EBF5FB',c:'#2E86C1'},C:{bg:'#FDFEFE',c:'#7F8C8D'}};
  var abcSlice=analABC.slice(abcPage*ABC_PAGE,(abcPage+1)*ABC_PAGE);
  var abcPages=Math.ceil(analABC.length/ABC_PAGE);
  var subTabs=[{id:'fornecedor',label:'📦 Por Fornecedor'},{id:'abc',label:'📊 Curva ABC'},{id:'periodo',label:'⏱ Por Período'}];

  if(!sugestoes.length)return h('div',{style:{padding:40,textAlign:'center'}},
    h('div',{style:{fontSize:48}},'📊'),
    h('p',{style:{color:'#7F8C8D',marginTop:12}},'Importe uma planilha de estoque ou sugestões para ver as análises.'),
    h('button',{className:'btn',style:{marginTop:16},onClick:function(){setTab('sugestoes');}}, '← Ir para Sugestões')
  );

  return h('div',{style:{padding:24}},
    h('div',{style:{display:'flex',gap:6,marginBottom:20,borderBottom:'2px solid #e2d8df',paddingBottom:0}},
      subTabs.map(function(st){
        var active=subTab===st.id;
        return h('button',{key:st.id,onClick:function(){setSubTab(st.id);setAbcPage(0);},
          style:{padding:'9px 18px',borderRadius:'6px 6px 0 0',border:'1px solid '+(active?'#e2d8df':'transparent'),borderBottom:active?'2px solid #fff':'none',
            cursor:'pointer',fontSize:13,fontWeight:active?700:400,background:active?'#fff':'transparent',color:active?'#651D32':'#7F8C8D',marginBottom:-2}
        },st.label);
      })
    ),

    subTab==='fornecedor'?h('div',null,
      h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}},
        h('div',null,
          h('h3',{style:{margin:0,color:'#651D32'}},'Sugestões por Fornecedor'),
          h('p',{style:{margin:'4px 0 0',color:'#7F8C8D',fontSize:13}},analForn.length+' fornecedores · Total: '+fmt$(totalSug))
        )
      ),
      !analForn.length
        ?h('div',{style:{textAlign:'center',padding:40,color:'#7F8C8D'}},'Nenhuma sugestão de compra pendente. Use a aba Sugestões para calcular quantidades.')
        :h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(300px,1fr))',gap:12}},
          analForn.map(function(f){
            var pct=totalSug>0?Math.round(f.valor/totalSug*100):0;
            return h('div',{key:f.nome,style:{background:'#fff',border:'1px solid #e2d8df',borderRadius:8,padding:16}},
              h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}},
                h('div',{style:{fontWeight:700,color:'#2D3436',fontSize:14,flex:1,paddingRight:8}},f.nome),
                h('span',{style:{background:'#faf7f8',color:'#651D32',fontSize:11,padding:'2px 8px',borderRadius:10,fontWeight:600,whiteSpace:'nowrap'}},pct+'% do total')
              ),
              h('div',{style:{display:'flex',gap:16,marginBottom:10}},
                h('div',null,h('div',{style:{fontSize:11,color:'#7F8C8D'}},'Itens'),h('div',{style:{fontSize:20,fontWeight:700,color:'#2D3436'}},f.itens)),
                h('div',null,h('div',{style:{fontSize:11,color:'#7F8C8D'}},'Valor Pedido'),h('div',{style:{fontSize:20,fontWeight:700,color:'#27AE60'}},fmt$(f.valor)))
              ),
              h('div',{style:{background:'#faf7f8',borderRadius:4,height:6,marginBottom:12}},
                h('div',{style:{background:'#651D32',height:6,borderRadius:4,width:Math.min(100,pct)+'%'}})
              ),
              h('button',{style:{width:'100%',padding:'8px 0',background:'#651D32',color:'#fff',border:'none',borderRadius:6,cursor:'pointer',fontSize:13,fontWeight:600},
                onClick:function(){setTab('pedidos');}
              },'📋 Criar Pedido de Compra')
            );
          })
        )
    ):null,

    subTab==='abc'?h('div',null,
      h('div',{style:{marginBottom:16}},
        h('h3',{style:{margin:0,color:'#651D32'}},'Curva ABC de Produtos'),
        h('p',{style:{margin:'4px 0 0',color:'#7F8C8D',fontSize:13}},analABC.length+' produtos com valor calculado'),
        h('div',{style:{display:'flex',gap:12,marginTop:12}},
          ['A','B','C'].map(function(cls){
            var cc=abcClr[cls];
            var grp=analABC.filter(function(x){return x.classe===cls;});
            return h('div',{key:cls,style:{background:cc.bg,border:'1px solid '+cc.c,borderRadius:8,padding:'12px 16px',flex:1,textAlign:'center'}},
              h('div',{style:{fontSize:24,fontWeight:900,color:cc.c}},'Curva '+cls),
              h('div',{style:{fontSize:13,color:'#7a6575',marginTop:4}},grp.length+' itens'),
              h('div',{style:{fontSize:13,color:cc.c,fontWeight:600}},fmt$(grp.reduce(function(a,x){return a+x._val;},0))),
              h('div',{style:{fontSize:11,color:'#7F8C8D'}},cls==='A'?'80% do valor':cls==='B'?'15% do valor':'5% do valor')
            );
          })
        )
      ),
      h('table',{className:'tbl'},
        h('thead',null,h('tr',null,h('th',null,'#'),h('th',null,'Classe'),h('th',null,'Cód'),h('th',null,'Produto'),
          h('th',{style:{textAlign:'right'}},'Valor'),h('th',{style:{textAlign:'right'}},'% Acum.'),h('th',null,'Fornecedor'))),
        h('tbody',null,abcSlice.map(function(s){
          var cc=abcClr[s.classe];
          return h('tr',{key:s.id},
            h('td',{style:{color:'#7F8C8D',fontSize:11}},s.rank),
            h('td',null,h('span',{style:{background:cc.bg,color:cc.c,padding:'2px 8px',borderRadius:10,fontWeight:700,fontSize:12}},s.classe)),
            h('td',null,h('code',{style:{fontSize:11}},s.cod)),
            h('td',{style:{maxWidth:200,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},s.produto),
            h('td',{style:{textAlign:'right',fontWeight:600}},fmt$(s._val)),
            h('td',{style:{textAlign:'right',color:'#7F8C8D',fontSize:12}},s.pct_cum+'%'),
            h('td',{style:{maxWidth:120,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',color:'#7a6575',fontSize:12}},s.fornecedor_nome||'—')
          );
        }))
      ),
      abcPages>1?h('div',{style:{display:'flex',gap:8,marginTop:12,justifyContent:'center',alignItems:'center'}},
        h('button',{className:'btn-outline',disabled:abcPage===0,onClick:function(){setAbcPage(abcPage-1);}}, '← Anterior'),
        h('span',{style:{fontSize:13,color:'#7F8C8D'}},''+(abcPage+1)+' / '+abcPages),
        h('button',{className:'btn-outline',disabled:abcPage>=abcPages-1,onClick:function(){setAbcPage(abcPage+1);}}, 'Próxima →')
      ):null
    ):null,

    subTab==='periodo'?h('div',null,
      h('h3',{style:{margin:'0 0 16px',color:'#651D32'}},'Análise de Cobertura por Período'),
      h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(190px,1fr))',gap:12,marginBottom:24}},
        analPeriodo.map(function(b){
          var pct=sugestoes.length>0?Math.round(b.count/sugestoes.length*100):0;
          return h('div',{key:b.id,style:{background:b.bg,border:'1px solid '+b.color,borderRadius:8,padding:16,textAlign:'center'}},
            h('div',{style:{fontSize:16,fontWeight:700,color:b.color,marginBottom:6}},b.emoji+' '+b.label),
            h('div',{style:{fontSize:32,fontWeight:900,color:b.color}},b.count),
            h('div',{style:{fontSize:12,color:'#7F8C8D'}},pct+'% dos itens'),
            b.valor>0?h('div',{style:{fontSize:12,color:b.color,fontWeight:600,marginTop:4}},fmt$(b.valor)):null
          );
        })
      ),
      analPeriodo.filter(function(b){return b.count>0;}).map(function(b){
        return h('details',{key:b.id,style:{marginBottom:8,border:'1px solid '+b.color,borderRadius:6,overflow:'hidden'}},
          h('summary',{style:{padding:'10px 14px',cursor:'pointer',background:b.bg,color:b.color,fontWeight:600,fontSize:13,listStyle:'none',display:'flex',justifyContent:'space-between'}},
            h('span',null,b.emoji+' '+b.label+' — '+b.count+' produtos'),
            b.valor>0?h('span',null,fmt$(b.valor)):null
          ),
          h('table',{className:'tbl',style:{margin:0}},
            h('thead',null,h('tr',null,h('th',null,'Cód'),h('th',null,'Produto'),h('th',{style:{textAlign:'right'}},'Estoque'),h('th',{style:{textAlign:'right'}},'Cobertura'),h('th',null,'Fornecedor'))),
            h('tbody',null,b.itens.slice(0,50).map(function(s){
              return h('tr',{key:s.id},
                h('td',null,h('code',{style:{fontSize:11}},s.cod)),

                h('td',{style:{textAlign:'right'}},fmt0(s.estoque)),

                h('td',{style:{maxWidth:120,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',color:'#7a6575',fontSize:12}},s.fornecedor_nome||'—')
              );
            }))

        );

// ── APP ────────────────────────────────────────────────────────────────────
function App(){
  var [email,setEmail]=useState(null);
  var [tab,setTab]=useState('painel');
  var [booting,setBooting]=useState(true);
  var [fornecedores,setFornecedores]=useState([]);
  var [sugestoes,setSugestoes]=useState([]);
  var [pedidos,setPedidos]=useState([]);
  var [validades,setValidades]=useState([]);
  var [toast,setToast]=useState(null);

  function showToast(msg){setToast(msg);};

  var [denied,setDenied]=useState(null);

  useEffect(function(){
    store.initSession().then(function(sess){
      if(!sess){setBooting(false);return;}
      store.checkAccess().then(function(acc){
        if(!acc.ok){setDenied(acc.reason||'error');setBooting(false);return;}
        store.audit('open_app');
        store.loadAll().then(function(){
          setFornecedores(store.get('fornecedores')||[]);
          setSugestoes(store.get('sugestoes')||[]);
          setPedidos(store.get('pedidos')||[]);
          setValidades(store.get('validades')||[]);
          setEmail(sess.email);setBooting(false);
        });
      });
    });
  },[]);

  function handleLogout(){
    store.signOut();
    setEmail(null);setDenied(null);setTab('painel');
    setFornecedores([]);setSugestoes([]);setPedidos([]);setValidades([]);
    setTimeout(function(){window.location.reload();},150);
  }

  if(booting)return h('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',color:'#7a6575',fontSize:14,background:'#faf7f8'}},'Carregando…');
  if(!email)return h(LoginScreen,{denied:denied,onLogout:handleLogout});

  var ocAbertas=pedidos.filter(function(p){return p.status!=='Recebido'&&p.status!=='Cancelado';}).length;
  var valVenc=validades.filter(function(v){return v.dias_restantes<=30;}).length;
  var TABS=[
    {id:'painel',        label:'🏠 Painel'},
    {id:'sugestoes',     label:'🛒 Sugestões'},
    {id:'fornecedores',  label:'🏭 Fornecedores'},
    {id:'estoque',       label:'📦 Estoque'},
    {id:'pedidos',       label:h('span',null,'📋 Pedidos',ocAbertas>0?h('span',{style:{marginLeft:5,background:'#D68910',color:'#fff',borderRadius:10,fontSize:10,padding:'1px 6px'}},ocAbertas):null)},
    {id:'validades',     label:h('span',null,'📅 Validades',valVenc>0?h('span',{style:{marginLeft:5,background:'#C0392B',color:'#fff',borderRadius:10,fontSize:10,padding:'1px 6px'}},valVenc):null)},
    {id:'analises',      label:'📊 Análises'}
  ];

  return h('div',{style:{minHeight:'100vh',background:'#faf7f8'}},
    h(Header,{email:email,onLogout:handleLogout}),
    h('div',{style:{background:'#fff',borderBottom:'1px solid #e2d8df',padding:'0 24px',display:'flex',gap:2,overflowX:'auto'}},
      TABS.map(function(t){return h('button',{key:t.id,className:'tab'+(tab===t.id?' active':''),onClick:function(){setTab(t.id);}},t.label);})),
    h('div',{style:{maxWidth:1440,margin:'0 auto'}},
      tab==='painel'?       h(PainelExecutivo,{sugestoes:sugestoes,fornecedores:fornecedores,pedidos:pedidos,setTab:setTab}):
      tab==='sugestoes'?    h(SugestoesCompras,{sugestoes:sugestoes,setSugestoes:setSugestoes,pedidos:pedidos,setPedidos:setPedidos,setTab:setTab,showToast:showToast}):
      tab==='fornecedores'? h(GestaoFornecedores,{fornecedores:fornecedores,setFornecedores:setFornecedores,sugestoes:sugestoes}):
      tab==='estoque'?      h(EstoqueAlertas,{sugestoes:sugestoes,setSugestoes:setSugestoes}):
      tab==='pedidos'?      h(PedidosAbertos,{pedidos:pedidos,setPedidos:setPedidos,fornecedores:fornecedores,showToast:showToast}):
      tab==='validades'?    h(ValidadesModule,{validades:validades,setValidades:setValidades}):
      tab==='analises'?     h(AnaliseModule,{sugestoes:sugestoes,setTab:setTab}):null
    ),
    toast?h(Toast,{msg:toast,onClose:function(){setToast(null);}}):null
  );
}

ReactDOM.render(h(App),document.getElementById('root'));
</script>
